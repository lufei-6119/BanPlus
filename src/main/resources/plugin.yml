name: BanPlus
version: '${version}'

main: com.banplus.BanPlus
api-version: '1.20'
load: POSTWORLD

commands:
  ban:
    description: 封禁玩家
    usage: /ban <玩家> <天数> <原因>
    permission: banplus.ban

  unban:
    description: 解封玩家
    usage: /unban <玩家>
    permission: banplus.unban

  banplus:
    description: BanPlus 主命令
    usage: /banplus <ban|unban>
    permission: banplus.ban

permissions:
  banplus.ban:
    description: 允许使用 BanPlus 封禁玩家
    default: op

  banplus.unban:
    description: 允许使用 BanPlus 解封玩家
    default: op
